[project]
name = "voxara-backend"
version = "1.0.0"
description = "Voxara AI Voice Agent SaaS — FastAPI Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.20",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pgvector==0.3.6",
    "redis==5.2.1",
    "arq==0.26.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "httpx==0.28.1",
    "twilio==9.3.3",
    "openai==1.59.4",
    "pydantic-settings==2.7.0",
    "pydantic[email]==2.10.4",
    "cryptography==44.0.0",
    "tenacity==9.0.0",
    "structlog==24.4.0",
    "aiofiles==24.1.0",
    "bcrypt>=5.0.0",
    "websockets>=13.0",
]

[tool.uv]
dev-dependencies = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "httpx==0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
